<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="cache-control" content="no-cache">
<title>私人空间</title>
<link rel="icon" type="image/svg+xml" href="/images/site/favicon.svg">
<style>
  :root {
    --ink: #08080a;
    --ink-2: #101014;
    --gold: #d3ab6a;
    --gold-dim: rgba(211, 171, 106, 0.42);
    --gold-faint: rgba(211, 171, 106, 0.16);
    --text: #e6e0d4;
    --muted: #7d776c;
    --danger: #d9745f;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: Georgia, "Songti SC", "SimSun", "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 背景:两团极暗的光晕 + 细颗粒 */
  .backdrop {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(680px 420px at 50% 12%, rgba(211, 171, 106, 0.075), transparent 70%),
      radial-gradient(520px 520px at 50% 108%, rgba(70, 84, 120, 0.16), transparent 72%),
      var(--ink);
  }

  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.055;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at 50% 45%, transparent 35%, rgba(0, 0, 0, 0.55) 100%);
  }

  .hidden { display: none !important; }

  /* 载入态 */
  .boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
  }

  .boot .ring {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--gold-faint);
    border-top-color: var(--gold-dim);
    animation: spin 1.6s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* 卡片 */
  #staticrypt_content {
    width: 100%;
    max-width: 372px;
  }

  .card {
    position: relative;
    width: 100%;
    padding: 46px 34px 30px;
    text-align: center;
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.008));
    border: 1px solid var(--gold-faint);
    border-radius: 2px;
    box-shadow:
      0 40px 90px -50px rgba(0, 0, 0, 0.95),
      inset 0 1px 0 rgba(255, 255, 255, 0.04);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1s ease, transform 1s ease;
  }

  .card::before,
  .card::after {
    content: "";
    position: absolute;
    left: 50%;
    width: 64px;
    height: 1px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }

  .card::before { top: -1px; }
  .card::after { bottom: -1px; }

  #staticrypt_content.ready .card {
    opacity: 1;
    transform: translateY(0);
  }

  /* 印记 */
  .sigil {
    position: relative;
    width: 74px;
    height: 74px;
    margin: 0 auto 30px;
    display: grid;
    place-items: center;
  }

  .sigil svg {
    width: 38px;
    height: 38px;
    stroke: var(--gold);
    fill: none;
    stroke-width: 1.1;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 10px rgba(211, 171, 106, 0.35));
    animation: breathe 5.5s ease-in-out infinite;
  }

  .sigil .orbit {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(211, 171, 106, 0.22);
    border-top-color: transparent;
    border-left-color: transparent;
    animation: spin 26s linear infinite;
  }

  .sigil .orbit:nth-child(2) {
    inset: 8px;
    border-top-color: rgba(211, 171, 106, 0.22);
    border-left-color: transparent;
    border-right-color: transparent;
    animation-duration: 17s;
    animation-direction: reverse;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.72; filter: drop-shadow(0 0 6px rgba(211, 171, 106, 0.22)); }
    50% { opacity: 1; filter: drop-shadow(0 0 16px rgba(211, 171, 106, 0.5)); }
  }

  h1 {
    margin: 0 0 14px;
    font-size: 1.42rem;
    font-weight: 500;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: var(--text);
  }

  .lede {
    margin: 0 0 34px;
    font-size: 0.82rem;
    line-height: 2.05;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  form { margin: 0; }

  .field {
    position: relative;
    text-align: left;
  }

  .field input {
    width: 100%;
    padding: 13px 38px 13px 1px;
    background: transparent;
    border: 0;
    border-bottom: 1px solid rgba(255, 255, 255, 0.14);
    color: var(--text);
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 0.95rem;
    letter-spacing: 0.3em;
    outline: 0;
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
  }

  .field input::placeholder {
    color: rgba(125, 119, 108, 0.75);
    letter-spacing: 0.22em;
    font-family: Georgia, "Songti SC", "SimSun", serif;
  }

  .field input:focus {
    border-bottom-color: var(--gold-dim);
    box-shadow: 0 14px 26px -22px var(--gold);
  }

  .field .reveal {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    padding: 0;
    background: transparent;
    border: 0;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.3s ease;
  }

  .field .reveal:hover { opacity: 0.9; }

  .field .reveal svg {
    width: 17px;
    height: 17px;
    stroke: var(--text);
    fill: none;
    stroke-width: 1.3;
  }

  .field .reveal .slash { opacity: 0; transition: opacity 0.2s ease; }
  .field .reveal.on .slash { opacity: 1; }

  .remember {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 18px 0 0;
    font-size: 0.76rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    cursor: pointer;
    user-select: none;
  }

  .remember input {
    appearance: none;
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    margin: 0;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 2px;
    background: transparent;
    cursor: pointer;
    position: relative;
    transition: border-color 0.3s ease, background 0.3s ease;
  }

  .remember input:checked {
    border-color: var(--gold-dim);
    background: rgba(211, 171, 106, 0.18);
  }

  .remember input:checked::after {
    content: "";
    position: absolute;
    left: 3.5px;
    top: 0.5px;
    width: 4px;
    height: 8px;
    border-right: 1.4px solid var(--gold);
    border-bottom: 1.4px solid var(--gold);
    transform: rotate(40deg);
  }

  .enter {
    position: relative;
    width: 100%;
    margin-top: 26px;
    padding: 13px 0;
    background: transparent;
    border: 1px solid var(--gold-faint);
    border-radius: 2px;
    color: var(--gold);
    font-family: inherit;
    font-size: 0.86rem;
    letter-spacing: 0.62em;
    text-indent: 0.62em;
    cursor: pointer;
    transition: background 0.45s ease, border-color 0.45s ease, box-shadow 0.45s ease, color 0.45s ease;
  }

  .enter:hover:not(:disabled) {
    background: rgba(211, 171, 106, 0.07);
    border-color: var(--gold-dim);
    box-shadow: 0 0 34px -14px rgba(211, 171, 106, 0.75);
  }

  .enter:disabled {
    cursor: default;
    color: transparent;
    border-color: var(--gold-faint);
  }

  .enter:disabled::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 15px;
    height: 15px;
    margin: -7.5px 0 0 -7.5px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
    border-top-color: transparent;
    animation: spin 0.9s linear infinite;
  }

  .error {
    min-height: 1.15em;
    margin: 14px 0 0;
    font-size: 0.76rem;
    letter-spacing: 0.1em;
    color: var(--danger);
    opacity: 0;
    transition: opacity 0.35s ease;
  }

  .error.show { opacity: 1; }

  .foot {
    margin: 30px 0 0;
    font-size: 0.68rem;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    color: rgba(125, 119, 108, 0.55);
  }

  .shake { animation: shake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  @media (max-width: 420px) {
    .card { padding: 38px 24px 26px; }
    h1 { font-size: 1.24rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sigil svg, .sigil .orbit, .boot .ring { animation: none; }
    .card { opacity: 1; transform: none; transition: none; }
    .shake { animation: none; }
  }
</style>
</head>
