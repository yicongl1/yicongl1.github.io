<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="cache-control" content="no-cache">
<title>私人空间</title>
<link rel="icon" type="image/svg+xml" href="/images/site/favicon-vault.svg">
<script>
  // 私人页统一用 vault-theme：手动选择优先，否则跟随系统。
  // 放在样式之前，首帧就已经是对的颜色。
  (function () {
    var saved = null;
    try { saved = localStorage.getItem("vault-theme"); } catch (e) {}
    var dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
    document.documentElement.setAttribute("data-theme", saved === "light" || saved === "dark" ? saved : (dark ? "dark" : "light"));
  })();
</script>
<style>
  /* 黑夜是默认外观；白天把纸色和墨色对调，金色换成暖褐。 */
  :root {
    --ink: #08080a;
    --gold: #d3ab6a;
    --gold-dim: rgba(211, 171, 106, 0.42);
    --gold-faint: rgba(211, 171, 106, 0.16);
    --gold-wash: rgba(211, 171, 106, 0.07);
    --text: #e6e0d4;
    --muted: #7d776c;
    --danger: #d9745f;
    --line: rgba(255, 255, 255, 0.14);
    --line-soft: rgba(255, 255, 255, 0.2);
    --card-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.008));
    --card-shadow: 0 40px 90px -50px rgba(0, 0, 0, 0.95), inset 0 1px 0 rgba(255, 255, 255, 0.04);
    --glow: rgba(211, 171, 106, 0.075);
    --glow-2: rgba(70, 84, 120, 0.16);
    --vignette: rgba(0, 0, 0, 0.55);
    --placeholder: rgba(125, 119, 108, 0.75);
    --boot-bg: #1c1a18;
    --boot-ink: #d9a066;
    --boot-muted: #9a9186;
    --boot-line: #3a352f;
    color-scheme: dark;
  }

  :root[data-theme="light"] {
    --ink: #faf7f2;
    --gold: #8c5a3c;
    --gold-dim: rgba(140, 90, 60, 0.42);
    --gold-faint: rgba(140, 90, 60, 0.2);
    --gold-wash: rgba(140, 90, 60, 0.06);
    --text: #2f2b26;
    --muted: #8a8178;
    --danger: #b4553f;
    --line: rgba(0, 0, 0, 0.16);
    --line-soft: rgba(0, 0, 0, 0.2);
    --card-bg: linear-gradient(180deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0.4));
    --card-shadow: 0 40px 80px -52px rgba(90, 70, 50, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.85);
    --glow: rgba(140, 90, 60, 0.09);
    --glow-2: rgba(150, 130, 100, 0.14);
    --vignette: rgba(120, 100, 70, 0.14);
    --placeholder: rgba(138, 129, 120, 0.85);
    --boot-bg: #faf7f2;
    --boot-ink: #8c5a3c;
    --boot-muted: #8a8178;
    --boot-line: #e7dfd4;
    color-scheme: light;
  }

  * { box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background: var(--ink);
    color: var(--text);
    font-family: Georgia, "Songti SC", "SimSun", "Times New Roman", serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* 记住密码后每次翻页仍会经过密码模板；解密期间显示一个安静的动画，
     底色与阅读页一致，避免深色/金色闪一下。 */
  body.booting {
    background: var(--boot-bg);
  }

  body.booting .backdrop,
  body.booting .vignette,
  body.booting .grain {
    display: none;
  }

  /* 背景:两团极暗的光晕 + 细颗粒 */
  .backdrop {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(680px 420px at 50% 12%, var(--glow), transparent 70%),
      radial-gradient(520px 520px at 50% 108%, var(--glow-2), transparent 72%),
      var(--ink);
  }

  .grain {
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.055;
    mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
  }

  .vignette {
    position: fixed;
    inset: 0;
    pointer-events: none;
    background: radial-gradient(circle at 50% 45%, transparent 35%, var(--vignette) 100%);
  }

  .hidden { display: none !important; }

  /* 载入/解密态：自带底色，从卡片切过来时以淡入代替硬切 */
  .boot {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    padding: 24px;
    background: var(--boot-bg);
    animation: boot-in 240ms ease;
  }

  @keyframes boot-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .boot-inner {
    text-align: center;
  }

  .boot-seal {
    position: relative;
    width: 88px;
    height: 88px;
    margin: 0 auto 24px;
    display: grid;
    place-items: center;
  }

  .boot-seal .orbit {
    position: absolute;
    inset: 0;
    border: 1px solid var(--boot-line);
    border-top-color: var(--boot-ink);
    border-radius: 50%;
    animation: spin 5.5s linear infinite;
    opacity: 0.75;
  }

  .boot-seal .orbit:nth-child(2) {
    inset: 13px;
    border-top-color: transparent;
    border-right-color: var(--boot-ink);
    animation-duration: 8s;
    animation-direction: reverse;
    opacity: 0.5;
  }

  .boot-seal svg {
    width: 30px;
    height: 30px;
    stroke: var(--boot-ink);
    fill: none;
    stroke-width: 1.15;
    stroke-linecap: round;
    stroke-linejoin: round;
    animation: boot-breathe 3.4s ease-in-out infinite;
  }

  .boot-label {
    margin: 0;
    font-size: 0.78rem;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    color: var(--boot-muted);
  }

  .boot-line {
    display: block;
    width: 124px;
    height: 1px;
    margin: 16px auto 0;
    overflow: hidden;
    background: var(--boot-line);
  }

  .boot-line i {
    display: block;
    width: 42%;
    height: 100%;
    background: var(--boot-ink);
    animation: boot-scan 1.1s ease-in-out infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  @keyframes boot-breathe {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }

  @keyframes boot-scan {
    0% { transform: translateX(-120%); }
    100% { transform: translateX(320%); }
  }

  /* 卡片 */
  #staticrypt_content {
    width: 100%;
    max-width: 372px;
  }

  .card {
    position: relative;
    width: 100%;
    padding: 46px 34px 30px;
    text-align: center;
    background: var(--card-bg);
    border: 1px solid var(--gold-faint);
    border-radius: 2px;
    box-shadow: var(--card-shadow);
    opacity: 0;
    transform: translateY(10px);
    transition: opacity 1s ease, transform 1s ease;
  }

  .card::before,
  .card::after {
    content: "";
    position: absolute;
    left: 50%;
    width: 64px;
    height: 1px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
  }

  .card::before { top: -1px; }
  .card::after { bottom: -1px; }

  #staticrypt_content.ready .card {
    opacity: 1;
    transform: translateY(0);
  }

  /* 印记 */
  .sigil {
    position: relative;
    width: 74px;
    height: 74px;
    margin: 0 auto 30px;
    display: grid;
    place-items: center;
  }

  .sigil svg {
    width: 38px;
    height: 38px;
    stroke: var(--gold);
    fill: none;
    stroke-width: 1.1;
    stroke-linecap: round;
    stroke-linejoin: round;
    filter: drop-shadow(0 0 10px rgba(211, 171, 106, 0.35));
    animation: breathe 5.5s ease-in-out infinite;
  }

  .sigil .orbit {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(211, 171, 106, 0.22);
    border-top-color: transparent;
    border-left-color: transparent;
    animation: spin 26s linear infinite;
  }

  .sigil .orbit:nth-child(2) {
    inset: 8px;
    border-top-color: rgba(211, 171, 106, 0.22);
    border-left-color: transparent;
    border-right-color: transparent;
    animation-duration: 17s;
    animation-direction: reverse;
  }

  @keyframes breathe {
    0%, 100% { opacity: 0.72; filter: drop-shadow(0 0 6px rgba(211, 171, 106, 0.22)); }
    50% { opacity: 1; filter: drop-shadow(0 0 16px rgba(211, 171, 106, 0.5)); }
  }

  h1 {
    margin: 0 0 14px;
    font-size: 1.42rem;
    font-weight: 500;
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: var(--text);
  }

  .lede {
    margin: 0 0 34px;
    font-size: 0.82rem;
    line-height: 2.05;
    color: var(--muted);
    letter-spacing: 0.08em;
  }

  form { margin: 0; }

  .field {
    position: relative;
    text-align: left;
  }

  .field input {
    width: 100%;
    padding: 13px 38px 13px 1px;
    background: transparent;
    border: 0;
    border-bottom: 1px solid var(--line);
    color: var(--text);
    font-family: ui-monospace, Consolas, "Courier New", monospace;
    font-size: 0.95rem;
    letter-spacing: 0.3em;
    outline: 0;
    transition: border-color 0.4s ease, box-shadow 0.4s ease;
  }

  .field input::placeholder {
    color: var(--placeholder);
    letter-spacing: 0.22em;
    font-family: Georgia, "Songti SC", "SimSun", serif;
  }

  .field input:focus {
    border-bottom-color: var(--gold-dim);
    box-shadow: 0 14px 26px -22px var(--gold);
  }

  .field .reveal {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%);
    width: 30px;
    height: 30px;
    padding: 0;
    background: transparent;
    border: 0;
    cursor: pointer;
    opacity: 0.45;
    transition: opacity 0.3s ease;
  }

  .field .reveal:hover { opacity: 0.9; }

  .field .reveal svg {
    width: 17px;
    height: 17px;
    stroke: var(--text);
    fill: none;
    stroke-width: 1.3;
  }

  .field .reveal .slash { opacity: 0; transition: opacity 0.2s ease; }
  .field .reveal.on .slash { opacity: 1; }

  .remember {
    display: flex;
    align-items: center;
    gap: 9px;
    margin: 18px 0 0;
    font-size: 0.76rem;
    color: var(--muted);
    letter-spacing: 0.1em;
    cursor: pointer;
    user-select: none;
  }

  .remember input {
    appearance: none;
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    margin: 0;
    border: 1px solid var(--line-soft);
    border-radius: 2px;
    background: transparent;
    cursor: pointer;
    position: relative;
    transition: border-color 0.3s ease, background 0.3s ease;
  }

  .remember input:checked {
    border-color: var(--gold-dim);
    background: rgba(211, 171, 106, 0.18);
  }

  .remember input:checked::after {
    content: "";
    position: absolute;
    left: 3.5px;
    top: 0.5px;
    width: 4px;
    height: 8px;
    border-right: 1.4px solid var(--gold);
    border-bottom: 1.4px solid var(--gold);
    transform: rotate(40deg);
  }

  .enter {
    position: relative;
    width: 100%;
    margin-top: 26px;
    padding: 13px 0;
    background: transparent;
    border: 1px solid var(--gold-faint);
    border-radius: 2px;
    color: var(--gold);
    font-family: inherit;
    font-size: 0.86rem;
    letter-spacing: 0.62em;
    text-indent: 0.62em;
    cursor: pointer;
    transition: background 0.45s ease, border-color 0.45s ease, box-shadow 0.45s ease, color 0.45s ease;
  }

  .enter:hover:not(:disabled) {
    background: var(--gold-wash);
    border-color: var(--gold-dim);
    box-shadow: 0 0 34px -14px rgba(211, 171, 106, 0.75);
  }

  .enter:disabled {
    cursor: default;
    color: transparent;
    border-color: var(--gold-faint);
  }

  .enter:disabled::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 50%;
    width: 15px;
    height: 15px;
    margin: -7.5px 0 0 -7.5px;
    border-radius: 50%;
    border: 1px solid var(--gold-dim);
    border-top-color: transparent;
    animation: spin 0.9s linear infinite;
  }

  .error {
    min-height: 1.15em;
    margin: 14px 0 0;
    font-size: 0.76rem;
    letter-spacing: 0.1em;
    color: var(--danger);
    opacity: 0;
    transition: opacity 0.35s ease;
  }

  .error.show { opacity: 1; }

  .foot {
    margin: 30px 0 0;
    font-size: 0.68rem;
    letter-spacing: 0.34em;
    text-indent: 0.34em;
    color: rgba(125, 119, 108, 0.55);
  }

  .shake { animation: shake 0.42s cubic-bezier(0.36, 0.07, 0.19, 0.97); }

  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  @media (max-width: 420px) {
    .card { padding: 38px 24px 26px; }
    h1 { font-size: 1.24rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sigil svg, .sigil .orbit, .boot-seal .orbit, .boot-seal svg, .boot-line i { animation: none; }
    .boot { animation: none; }
    .boot-line i { width: 100%; opacity: 0.35; }
    .card { opacity: 1; transform: none; transition: none; }
    .shake { animation: none; }
  }
</style>
</head>

            </svg>
          </button>
        </div>

        <label id="staticrypt-remember-label" class="remember hidden">
          <input id="staticrypt-remember" type="checkbox" name="remember" checked />
          <span>记住这台设备（7 天）</span>

        <button type="submit" class="enter">进入</button>
        <p id="staticrypt-error" class="error" role="alert" aria-live="polite"></p>
      </form>

      <p class="foot">仅 限 本 人</p>
    </main>
  </div>
