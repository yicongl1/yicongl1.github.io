<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Abstract illustration of a cross-border territory with a road, charging stations and a data network">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1e38"/>
      <stop offset="0.55" stop-color="#14304f"/>
      <stop offset="1" stop-color="#1c4268"/>
    </linearGradient>
    <linearGradient id="landA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d4a6e" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#163a5a" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="landB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#233f5f" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#163252" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7fd3ff"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fd3ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fd3ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- sky -->
  <rect width="1200" height="675" fill="url(#sky)"/>
  <g stroke="#2a5a86" stroke-opacity="0.25" stroke-width="1">
    <path d="M0 170 H1200 M0 340 H1200 M0 510 H1200"/>
    <path d="M200 0 V675 M400 0 V675 M600 0 V675 M800 0 V675 M1000 0 V675"/>
  </g>

  <!-- two territories separated by a border -->
  <path d="M0 675 L0 430 Q140 400 250 455 Q330 495 420 470 Q520 445 590 480 L590 675 Z" fill="url(#landA)"/>
  <path d="M1200 675 L1200 400 Q1080 370 970 430 Q900 468 830 450 Q730 430 640 470 L640 675 Z" fill="url(#landB)"/>

  <!-- border line -->
  <path d="M590 675 L590 480 Q520 445 420 470 Q330 495 250 455 Q140 400 0 430" fill="none" stroke="#cfe3f5" stroke-width="3" stroke-dasharray="14 10" stroke-opacity="0.75"/>
  <g fill="#cfe3f5" fill-opacity="0.9">
    <circle cx="590" cy="480" r="5"/>
    <circle cx="420" cy="470" r="4"/>
    <circle cx="250" cy="455" r="4"/>
  </g>

  <!-- road crossing the border -->
  <path d="M60 640 C 220 600, 320 620, 430 560 C 540 500, 560 510, 660 520 C 780 532, 880 470, 990 430 C 1060 405, 1120 395, 1170 390"
        fill="none" stroke="url(#road)" stroke-width="10" stroke-linecap="round"/>
  <path d="M60 640 C 220 600, 320 620, 430 560 C 540 500, 560 510, 660 520 C 780 532, 880 470, 990 430 C 1060 405, 1120 395, 1170 390"
        fill="none" stroke="#0c1e38" stroke-width="2.5" stroke-dasharray="16 14" stroke-opacity="0.85"/>

  <!-- charging station nodes -->
  <g>
    <circle cx="430" cy="560" r="46" fill="url(#glowA)"/>
    <circle cx="430" cy="560" r="13" fill="#7fd3ff"/>
    <circle cx="430" cy="560" r="24" fill="none" stroke="#7fd3ff" stroke-opacity="0.5" stroke-width="2"/>

    <circle cx="660" cy="520" r="52" fill="url(#glowB)"/>
    <path d="M668 498 L652 526 L663 526 L657 548 L676 519 L664 519 Z" fill="#ffd166" stroke="#1c2f47" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="660" cy="520" r="30" fill="none" stroke="#ffd166" stroke-opacity="0.45" stroke-width="2"/>

    <circle cx="990" cy="430" r="40" fill="url(#glowA)"/>
    <circle cx="990" cy="430" r="11" fill="#7fd3ff"/>
    <circle cx="990" cy="430" r="21" fill="none" stroke="#7fd3ff" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <!-- data network above the territories -->
  <g stroke="#9fc8ea" stroke-opacity="0.45" stroke-width="1.5">
    <path d="M170 190 L330 130 L470 205 L620 120 L780 175 L930 110 L1060 185"/>
    <path d="M330 130 L620 120 M470 205 L620 120 M620 120 L780 175 M780 175 L930 110"/>
    <path d="M330 130 L470 205 M170 190 L470 205 M930 110 L1060 185"/>
  </g>
  <g fill="#9fc8ea">
    <circle cx="170" cy="190" r="6" fill-opacity="0.85"/>
    <circle cx="330" cy="130" r="8" fill-opacity="0.95"/>
    <circle cx="470" cy="205" r="6" fill-opacity="0.8"/>
    <circle cx="620" cy="120" r="9" fill-opacity="0.95"/>
    <circle cx="780" cy="175" r="6" fill-opacity="0.8"/>
    <circle cx="930" cy="110" r="8" fill-opacity="0.95"/>
    <circle cx="1060" cy="185" r="6" fill-opacity="0.85"/>
  </g>
  <g fill="none" stroke="#9fc8ea" stroke-opacity="0.5" stroke-width="1.5">
    <circle cx="330" cy="130" r="15"/>
    <circle cx="620" cy="120" r="17"/>
    <circle cx="930" cy="110" r="15"/>
  </g>

  <!-- tiny vehicles on the road -->
  <g>
    <rect x="250" y="596" width="26" height="12" rx="3" fill="#7fd3ff" transform="rotate(-6 250 596)"/>
    <rect x="850" y="502" width="26" height="12" rx="3" fill="#ffd166" transform="rotate(-14 850 502)"/>
  </g>

  <!-- subtle stars -->
  <g fill="#cfe3f5">
    <circle cx="90" cy="70" r="2" fill-opacity="0.6"/>
    <circle cx="270" cy="45" r="1.6" fill-opacity="0.5"/>
    <circle cx="520" cy="60" r="2" fill-opacity="0.6"/>
    <circle cx="700" cy="40" r="1.5" fill-opacity="0.45"/>
    <circle cx="880" cy="65" r="2" fill-opacity="0.55"/>
    <circle cx="1100" cy="50" r="1.7" fill-opacity="0.5"/>
    <circle cx="400" cy="95" r="1.5" fill-opacity="0.4"/>
    <circle cx="1000" cy="90" r="1.5" fill-opacity="0.4"/>
  </g>
</svg>
